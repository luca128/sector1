<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Administrare Blocuri">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AB0F2"/>
      <stop offset="1" stop-color="#8FCBFB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="0" y="0" width="120" height="120" rx="26"/></clipPath>
  </defs>

  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#tile)"/>
  <g clip-path="url(#sq)">
    <!-- ground -->
    <rect x="22" y="90" width="76" height="10" rx="3" fill="#3ED9A0"/>

    <!-- short block (left) -->
    <rect x="27" y="58" width="18" height="32" rx="4" fill="#ffffff" fill-opacity="0.92"/>
    <g fill="#BFE0FB">
      <rect x="31" y="63" width="6" height="6" rx="1.5"/>
      <rect x="39" y="63" width="6" height="6" rx="1.5"/>
      <rect x="31" y="74" width="6" height="6" rx="1.5"/>
      <rect x="39" y="74" width="6" height="6" rx="1.5"/>
    </g>

    <!-- tall block (center) -->
    <rect x="49" y="32" width="22" height="58" rx="5" fill="#ffffff"/>
    <g fill="#BFE0FB">
      <rect x="53" y="38" width="6" height="6" rx="1.5"/>
      <rect x="61" y="38" width="6" height="6" rx="1.5"/>
      <rect x="53" y="49" width="6" height="6" rx="1.5"/>
      <rect x="61" y="49" width="6" height="6" rx="1.5"/>
      <rect x="53" y="60" width="6" height="6" rx="1.5"/>
      <rect x="61" y="60" width="6" height="6" rx="1.5"/>
    </g>
    <path d="M56 90 v-13 a4 4 0 0 1 8 0 v13 z" fill="#3ED9A0"/>

    <!-- mid block (right) -->
    <rect x="75" y="46" width="18" height="44" rx="4" fill="#ffffff" fill-opacity="0.96"/>
    <g fill="#BFE0FB">
      <rect x="79" y="52" width="6" height="6" rx="1.5"/>
      <rect x="87" y="52" width="5" height="6" rx="1.5"/>
      <rect x="79" y="63" width="6" height="6" rx="1.5"/>
      <rect x="87" y="63" width="5" height="6" rx="1.5"/>
      <rect x="79" y="74" width="6" height="6" rx="1.5"/>
      <rect x="87" y="74" width="5" height="6" rx="1.5"/>
    </g>
  </g>
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#shine)"/>
</svg>
